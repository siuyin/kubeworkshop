apiVersion: v1
data:
  relay: |
    exporters:
      debug: {}
      otlphttp/openobserve:
        endpoint: http://openobserve.openobserve:5080/api/default
        headers:
          Authorization: Basic c2l1eWluQGJleW9uZGJyb2FkY2FzdC5jb206QnJvd24jRm94IzI=
          stream-name: "k8s"
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      filter/drop-openobserve-traces:
        error_mode: ignore
        traces:
          resource:
            - 'attributes["service.name"] == "openobserve"'
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      hostmetrics:
        collection_interval: 20s
        scrapers:
          cpu:
          memory:
          disk:
          load:
          network:
      prometheus:
        config:
          scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 5s
            static_configs:
            - targets:
              - ${env:MY_POD_IP}:8888
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
      filelog:
        include_file_path: true
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/opentelemetry-collector/*.log
          - /var/log/pods/*/openobserve/*.log
        operators:
          - id: container-parser
            type: container
          - id: drop-empty-lines
            type: filter
            expr: 'body matches "^[\\x00\\s]*$"'
          - id: drop-coredns-import-glob-warning
            type: filter
            expr: 'body contains "WARNING" and body contains "No files matching import glob pattern:"'
            drop-ratio: 1.0
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - debug
          - otlphttp/openobserve
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
          - filelog
        metrics:
          exporters:
          - debug
          - otlphttp/openobserve
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
          - prometheus
          - hostmetrics
        traces:
          exporters:
          - debug
          - otlphttp/openobserve
          processors:
          - memory_limiter
          - batch
          - filter/drop-openobserve-traces
          receivers:
          - otlp
          - jaeger
          - zipkin
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
        resource:
          host.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: otel-collector
    meta.helm.sh/release-namespace: default
  creationTimestamp: "2026-09-06T02:04:55Z"
  labels:
    app.kubernetes.io/component: agent-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/part-of: opentelemetry-collector
    app.kubernetes.io/version: 0.159.0
    helm.sh/chart: opentelemetry-collector-0.172.1
  name: otel-collector-opentelemetry-collector-agent
  namespace: default
  resourceVersion: "86044"
  uid: 9b67fa4f-70ab-483f-b554-88555fc04327
