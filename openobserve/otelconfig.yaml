receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/openobserve:
    endpoint: http://localhost:5080/api/default
    headers:
      Authorization: Basic c2l1eWluQGJleW9uZGJyb2FkY2FzdC5jb206QnJvd24jRm94IzI=
      stream-name: "otel"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
