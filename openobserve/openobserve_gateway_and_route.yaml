apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openobserve
  namespace: openobserve
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 9080
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openobserve
  namespace: openobserve
spec:
  parentRefs:
  - name: openobserve
  hostnames:
  - "openobserve.localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openobserve
      port: 5080
