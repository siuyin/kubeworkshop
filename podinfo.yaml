---
apiVersion: v1
kind: Namespace
metadata: 
  name: geekshacking
  labels: 
    env: workshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podinfo
  namespace: geekshacking
data:
  PODINFO_UI_COLOR: "#cc0099"
  PODINFO_UI_MESSAGE: Gerbau Terpau
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: geekshacking
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - name: podinfo-container
        image: stefanprodan/podinfo:6.14.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9898
        envFrom:
        - configMapRef:
            name: podinfo
---
apiVersion: v1
kind: Service
metadata:
  namespace: geekshacking
  name: podinfo
spec:
  type: NodePort
  selector:
    app: podinfo
  ports:
  - port: 8080
    targetPort: 9898
